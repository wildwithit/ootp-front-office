appId: com.wildwithit.rangersfrontoffice
productName: Rangers Front Office
copyright: Copyright © 2026 Kevin Ivy

directories:
  output: release
  buildResources: build

# Keep artifacts distinct from upstream downloads.
artifactName: ${name}-${version}-${arch}.${ext}

files:
  - build/main.cjs
  - build/main.cjs.map
  - build/preload.cjs
  - package.json
  - LICENSE

# The built frontend lives outside the asar archive so Express can serve it
# from a real path, and so APP_ROOT (= resourcesPath) resolves ./dist.
extraResources:
  - from: dist
    to: dist

# Native modules cannot be loaded from inside an asar archive
asarUnpack:
  - node_modules/better-sqlite3/**

mac:
  identity: "-"
  category: public.app-category.sports
  # electron-builder renders the .icns from this single high-res source
  icon: docs/icons/frontoffice.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Signing and notarization are picked up from environment variables in CI
  # (CSC_LINK / CSC_KEY_PASSWORD, APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID). Builds run fine unsigned when they are absent.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: ${productName}

win:
  # and the .ico from the same file, so both platforms stay in sync
  icon: docs/icons/frontoffice.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Rangers Front Office

linux:
  target: [AppImage]
  category: Game

# Prevent electron-builder from inferring the fork as an update feed.
publish: null
